# Configuración global del proyecto TFM
# Las rutas son relativas a la raíz del proyecto.

zona_horaria: Europe/Madrid

# Centro de Málaga: referencia para calcular la elevación solar (iluminación día/crepúsculo/noche)
ubicacion:
  lat: 36.7213
  lon: -4.4214

rutas:
  datos: data/malaga
  raw: data/malaga/raw
  catalogo: data/malaga/da_camarasTrafico-4326.csv
  festivos: data/malaga/calendario_festivos_malaga.csv
  metadata: data/malaga/metadata
  logs: data/malaga/logs
  refresco: data/malaga/refresco
  fases: data/malaga/fases            # una salida por fase de 02_* (parquet)
  meteo_cache: data/malaga/weather_cache
  anotacion: data/malaga/anotacion
  dataset_yolo: data/malaga/yolo26_dataset
  resultados: data/malaga/resultados
  runs: runs

captura:
  # camaras seleccionadas para el muestreo continuo
  camaras: [21560, 75098, 21564, 78681, 21603, 21545, 21556, 75095, 21563, 21547, 21541, 21616,
            21568, 21577, 21595, 21582, 21598, 21573, 21554, 75024, 21618, 21580, 21587, 75093]
  intervalo_punta_s: 30 #
  intervalo_valle_s: 60
  horas_punta:                       # hora local
    - ["07:00", "10:00"]
    - ["13:00", "16:00"]
    - ["17:00", "20:00"]
  timeout_s: 15
  # Cámaras de referencia a la frecuencia de refresco medida (6 s, ver 00b) para poder medir
  # duraciones de fase semafórica (OE-4). Solo en hora punta para limitar el volumen de espacio (~3 GB/día).
  alta_frecuencia:
    # utilizadas para medir el refresco
    camaras: [21547, 21541, 21560, 21563, 21545]
    intervalo_s: 6
    solo_hora_punta: true
  # No guarda la imagen si el servidor no ha publicado una nueva desde la captura anterior
  # (mismo Last-Modified); se registra como SIN_CAMBIOS
  descartar_sin_cambios: true

refresco:
  # utilizadas para medir el refresco
  camaras_referencia: [21547, 21541, 21560, 21563, 21545]

calidad:
  min_ancho: 640
  min_alto: 480
  brillo_min_dia: 30          # solo exigible a imágenes de día (las nocturnas son oscuras por naturaleza)
  brillo_max: 220
  percentil_nitidez_min: 5    # umbral de nitidez = percentil global de la varianza del Laplaciano
  max_fraccion_fallos: 0.30   # una cámara va a la lista negra si falla más de este % de sus imágenes de día
  pesos_score:                # sobre métricas normalizadas (percentil 0-1 por métrica)
    brillo: 0.35
    nitidez: 0.65

muestreo:
  segundos_por_defecto: 30    # se usa si no hay medición de refresco
  usar_refresco_medido: true  # usa la mediana del refresco medido en 00b (no tiene sentido muestrear más rápido)

iluminacion:
  elevacion_crepusculo: -6    # grados: sol entre -6 y 0 = crepúsculo civil; por debajo, noche

meteo:
  max_diff_minutos: 60
  max_distancia_km: 40

deteccion:
  modelo: yolo26s.pt
  conf: 0.25
  imgsz: 640

cvat:
  version: v2.78.0
  proyecto: "TFM Malaga - semaforos, peatones y vehiculos"
  lote: lote_01
  n_imagenes_lote: 300
  max_por_camara: 20
  segment_size: 50
  # Separación mínima entre dos imágenes de la misma cámara dentro de los lotes: a 6 s son casi
  # idénticas (no aportan información y, repartidas entre train y val, inflan las métricas)
  separacion_minima_min: 10
  # Lote prioritario (03b): imágenes que compensan los grupos escasos, en un único job ordenado
  lote_prioritario: lote_02_prioritario
  n_imagenes_prioritario: 100
  max_por_camara_prioritario: 5

estado_vehiculos:
  # Distinguir coches aparcados de los que esperan al semáforo (06_clasificacion_estado_vehiculos):
  # 1) zonas por cámara dibujadas en CVAT (zona_espera / zona_aparcamiento)
  # 2) persistencia temporal: un vehículo inmóvil más de `tiempo_aparcado_s` está aparcado
  camaras: [21547, 21541, 21560, 21563, 21545]
  proyecto_zonas: "TFM Malaga - zonas de espera"
  zonas: data/malaga/zonas/zonas_camaras.json
  iou_mismo_vehiculo: 0.3      # solape mínimo para enlazar una caja con la del fotograma anterior
  iou_inmovil: 0.7             # solape mínimo para considerar que el vehículo no se ha movido
  max_hueco_s: 15              # se corta el seguimiento si dos imágenes distan más que esto
  tiempo_aparcado_s: 300       # ~3 ciclos semafóricos completos inmóvil = aparcado

entrenamiento:
  modelo: yolo26s.pt
  # hiperparametros
  epochs: 100
  patience: 20
  imgsz: 640
  batch: 8
  workers: 4
  n_folds: 5
  test_ratio: 0.15
  semilla: 42

evaluacion:
  # Las duraciones de fase solo se calculan si el refresco medido y el hueco entre imágenes
  # consecutivas permiten ver varias muestras por fase; si no, se usan fracciones de tiempo.
  max_refresco_para_duraciones_s: 10
  max_hueco_racha_s: 15
